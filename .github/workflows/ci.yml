# CPU-only continuous integration. GPU tests (SAM 2.1 tracking, VRAM budget) skip automatically
# without CUDA; they are run on the reference RTX 3050 machine before every release.
name: ci
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Python packages (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Generate the calibrated phantoms (no network, no CAMUS)
        run: python scripts/prepare_samples.py --skip-camus
      - name: Rebuild and verify the 3-D heart model
        run: python scripts/build_heart_glb.py
      - name: Tests
        run: pytest -q
      - name: CPU part of the paper benchmark (Experiment A + figures 1 and 4)
        run: python scripts/run_paper_benchmarks.py --skip-gpu
