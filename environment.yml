# conda env create -f environment.yml && conda activate echoplane3d
# then install SAM 2.1 and its checkpoint as described in README.md
name: echoplane3d
channels:
  - conda-forge
dependencies:
  - python=3.10
  - ffmpeg
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - torchvision==0.21.0
      - -r requirements.txt
